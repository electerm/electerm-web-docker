# Serve electerm-web under a sub-path, e.g. https://electerm.xxxx.com/electerm/
#
# Run the image with BASE_PATH=/electerm (see README): the page then emits
# /electerm prefixed asset, api and websocket urls, and the app itself accepts
# both the prefixed and the plain path, so this conf works whether or not nginx
# strips the prefix.
#
# The trailing slash on proxy_pass matters: with it nginx forwards /electerm/xyz
# as /xyz. Dropping it (proxy_pass http://electerm-web:5577;) forwards
# /electerm/xyz unchanged, which also works - the app strips the prefix itself.
#
# Note the websocket headers: terminals, sftp, rdp, vnc and spice all upgrade.

upstream electerm-web {
  server electerm-web:5577;
}

server {
  listen 80;
  server_name electerm.xxxx.com;

  location /electerm/ {
    proxy_pass http://electerm-web/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Upgrade           $http_upgrade;
    proxy_set_header        Connection        "upgrade";
    proxy_read_timeout 86400;  # 1 day timeout, ssh sessions idle for long
    proxy_send_timeout 86400;
  }

  # /electerm -> /electerm/ so the page's relative urls resolve
  location = /electerm {
    return 301 /electerm/;
  }
}
